<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Checador MAIF</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f4f4f4; color: #111; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  .logo { display: block; width: 100%; max-width: 300px; margin: 4px auto 10px; }
  h1 { font-size: 18px; margin: 4px 0 14px; padding-bottom: 10px; text-align: center; text-transform: uppercase;
       letter-spacing: .5px; border-bottom: 3px solid #881813; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  input, select { display: block; width: 100%; margin-top: 4px; padding: 12px; font-size: 16px;
          border: 1px solid #bdbdbd; border-radius: 10px; background: #fff; color: #111; }
  input:focus, select:focus { outline: 2px solid #881813; border-color: #881813; }
  .cam { position: relative; background: #000; border-radius: 12px; overflow: hidden;
         aspect-ratio: 3 / 4; margin: 6px 0 10px; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #reloj { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; font-size: 13px;
           color: #fff; background: rgba(0,0,0,.55); line-height: 1.35; }
  #estado { font-size: 13px; min-height: 18px; margin: 0 0 10px; text-align: center; color: #555; }
  #estado.error { color: #881813; font-weight: 700; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { padding: 18px 8px; font-size: 18px; font-weight: 700; border: 0; border-radius: 12px;
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #btnIn { background: #881813; }
  #btnOut { background: #111; }
  #otro { background: #881813; width: 100%; margin-top: 12px; }
  #resultado { text-align: center; }
  #resultado img { width: 100%; border-radius: 12px; }
  #msg { font-size: 17px; font-weight: 700; margin: 12px 0 0; padding: 14px; border-radius: 12px;
         background: #111; color: #fff; border-left: 6px solid #881813; }
  #msg small { display: block; font-weight: 500; margin-top: 4px; }
</style>
</head>

      </select>
    </label>
    <label>Puesto
      <select id="puesto">
        <option value="">Selecciona tu puesto</option>
        <option>Coordinador</option>
        <option>Supervisor</option>
        <option>Custodio</option>
        <option>Guardia</option>
      </select>
    </label>

    <div class="cam">
      <video id="video" autoplay playsinline muted></video>
      <div id="reloj">Obteniendo ubicación…</div>
    </div>

    <p id="estado"></p>

    <div class="botones">
      <button id="btnIn" disabled>INGRESO</button>
      <button id="btnOut" disabled>SALIDA</button>
    </div>
  </section>

  <section id="resultado" hidden>
    <img id="preview" alt="Foto registrada">
    <p id="msg"></p>
    <button id="otro">Nuevo registro</button>
  </section>
</main>

<canvas id="canvas" hidden></canvas>

<script>
  /* ====== PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT (termina en /exec) ====== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbxgVA6Bgl2Bld-k3RRu2EkDq0qdPanzas0kbv6Z3sGbyUVo3Vs7yZ0Z_ZeIBLDj4zqj/exec';
  /* ===================================================================================== */

  var ZONA = 'America/Mexico_City';
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), canvas = $('canvas');
  var camOK = false, pos = null, desfase = 0, enviando = false;

  /* ---- recordar nombre y servicio en este celular ---- */
  try {
    $('nombre').value = localStorage.getItem('chk_nombre') || '';
    $('servicio').value = localStorage.getItem('chk_servicio') || '';
    $('puesto').value = localStorage.getItem('chk_puesto') || '';
    $('turno').value = localStorage.getItem('chk_turno') || '';
  } catch (e) {}

  /* ---- hora oficial del servidor ---- */
  fetch(API_URL + '?accion=hora')
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.ms) desfase = d.ms - Date.now(); })
    .catch(function () {});

  function ahora() { return new Date(Date.now() + desfase); }
  function fechaHora(d) {
    return d.toLocaleString('es-MX', { timeZone: ZONA, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  /* ---- cámara frontal (solo captura en vivo, no hay opción de subir archivo) ---- */
  function iniciarCamara() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return error('Este navegador no permite usar la cámara.');
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
    }).then(function (stream) {
      video.srcObject = stream;
      video.onloadedmetadata = function () { camOK = true; actualizar(); };
    }).catch(function (e) {
      var n = e && e.name ? e.name : '';
      if (n === 'NotFoundError' || n === 'OverconstrainedError') error('No se encontró una cámara frontal en este dispositivo.');
      else if (n === 'NotReadableError') error('La cámara está en uso por otra aplicación. Ciérrala y recarga la página.');
      else error('Debes permitir el uso de la cámara para registrar. Revisa los permisos del navegador y recarga la página.');
    });
  }

  /* ---- ubicación ---- */
  function iniciarGPS() {
    if (!navigator.geolocation) return error('Este celular no permite obtener la ubicación.');
    navigator.geolocation.watchPosition(function (p) {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy };
      actualizar();
    }, function () {
      pos = null;
      error('Debes activar y permitir la ubicación (GPS) para registrar.');
      actualizar();
    }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  }

  function textoUbicacion() {
    return pos ? pos.lat.toFixed(6) + ', ' + pos.lng.toFixed(6) + ' (±' + Math.round(pos.precision) + ' m)'
               : 'Obteniendo ubicación…';
  }

  function error(t) { $('estado').textContent = t; $('estado').className = 'error'; }
  function info(t) { $('estado').textContent = t; $('estado').className = ''; }

  function actualizar() {
    var listo = camOK && pos && $('nombre').value.trim() && $('servicio').value.trim() && $('turno').value && $('puesto').value && !enviando;
    $('btnIn').disabled = $('btnOut').disabled = !listo;
    if (enviando) return;
    if (camOK && pos) {
      info(listo ? 'Listo. Mira a la cámara y presiona Ingreso o Salida.' : 'Escribe tu nombre y el servicio, y selecciona tu turno y tu puesto.');
    }
  }

  setInterval(function () {
    $('reloj').innerHTML = fechaHora(ahora()) + '<br>' + textoUbicacion();
  }, 1000);

  $('nombre').addEventListener('input', actualizar);
  $('servicio').addEventListener('input', actualizar);
  $('puesto').addEventListener('change', actualizar);
  $('turno').addEventListener('change', actualizar);

  /* ---- captura + sello en la foto ---- */
  function capturar(tipo, nombre, servicio, turno, puesto) {
    var w = Math.min(720, video.videoWidth), h = Math.round(w * video.videoHeight / video.videoWidth);
    canvas.width = w; canvas.height = h;
    var c = canvas.getContext('2d');
    c.drawImage(video, 0, 0, w, h);

    var lineas = [
      tipo + '  ' + fechaHora(ahora()),
      'Nombre: ' + nombre,
      'Servicio: ' + servicio,
      'Turno: ' + turno + '  ·  Puesto: ' + puesto,
      'Ubicación: ' + textoUbicacion()
    ];
    var tam = Math.max(14, Math.round(w / 30)), alto = Math.round(tam * 1.4), margen = Math.round(tam * 0.7);
    var franja = alto * lineas.length + margen * 2;
    c.fillStyle = 'rgba(0,0,0,0.6)';
    c.fillRect(0, h - franja, w, franja);
    c.fillStyle = '#fff';
    c.textBaseline = 'top';
    lineas.forEach(function (t, i) {
      var f = tam;
      c.font = (i === 0 ? 'bold ' : '') + f + 'px sans-serif';
      while (c.measureText(t).width > w - margen * 2 && f > 9) {
        f--; c.font = (i === 0 ? 'bold ' : '') + f + 'px sans-serif';
      }
      c.fillText(t, margen, h - franja + margen + i * alto);
    });
    return canvas.toDataURL('image/jpeg', 0.75);
  }

  function registrar(tipo) {
    if (enviando || !camOK || !pos) return;
    var nombre = $('nombre').value.trim(), servicio = $('servicio').value.trim(), turno = $('turno').value, puesto = $('puesto').value;
    if (!nombre || !servicio || !turno || !puesto) return;

    var foto = capturar(tipo, nombre, servicio, turno, puesto);
    try {
      localStorage.setItem('chk_nombre', nombre);
      localStorage.setItem('chk_servicio', servicio);
      localStorage.setItem('chk_puesto', puesto);
      localStorage.setItem('chk_turno', turno);
    } catch (e) {}

    enviando = true; actualizar();
    info('Guardando registro de ' + tipo.toLowerCase() + '…');

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        tipo: tipo, nombre: nombre, servicio: servicio, turno: turno, puesto: puesto, foto: foto,
        lat: pos.lat, lng: pos.lng, precision: pos.precision,
        dispositivo: navigator.userAgent
      })
    })
      .then(function (resp) { return resp.json(); })
      .then(function (r) {
        enviando = false;
        if (!r || !r.ok) {
          var m = r && r.error ? String(r.error) : '';
          error(m.indexOf('Ya se cuenta') === 0 ? m : 'No se pudo guardar' + (m ? ': ' + m : '.') + ' Intenta de nuevo.');
          actualizar();
          $('estado').className = 'error';
          return;
        }
        $('preview').src = foto;
        $('msg').innerHTML = '✔ Tu registro de ' + r.tipo + ' se realizó correctamente.<small>' + r.fecha + ' · ' + r.hora + '</small>';
        $('formulario').hidden = true;
        $('resultado').hidden = false;
      })
      .catch(function () {
        enviando = false;
        error('No se pudo guardar. Revisa tu conexión a internet e intenta de nuevo.');
        actualizar();
        $('estado').className = 'error';
      });
  }

  $('btnIn').addEventListener('click', function () { registrar('INGRESO'); });
  $('btnOut').addEventListener('click', function () { registrar('SALIDA'); });
  $('otro').addEventListener('click', function () {
    $('resultado').hidden = true;
    $('formulario').hidden = false;
    actualizar();
  });

  if (API_URL.indexOf('https://script.google.com/') !== 0) {
    error('Falta configurar la URL de Apps Script en el archivo index.html.');
  } else {
    iniciarCamara();
    iniciarGPS();
  }
</script>
</body>
</html>
